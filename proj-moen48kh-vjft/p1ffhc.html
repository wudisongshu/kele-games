<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>练习</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: #12121a;
  color: #e8eaf6;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: rgba(18,18,26,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
}
nav a {
  color: #aab2ff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.2s;
}
nav a:hover { color: #fff; }
nav h1 { font-size: 18px; font-weight: 600; letter-spacing: 2px; color: #fff; }

.page {
  width: 100%;
  height: 100%;
  padding-top: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

.table-area {
  position: relative;
  width: 96%;
  max-width: 900px;
  aspect-ratio: 2 / 1;
  margin-top: 12px;
  border-radius: 16px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.7);
  overflow: hidden;
  background: #1b1b1b;
}
#snookerCanvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
  touch-action: none;
}

.power-overlay {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 8px;
  background: rgba(0,0,0,0.45);
  border-radius: 4px;
  overflow: hidden;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.power-overlay.visible { opacity: 1; }
.power-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ffd54f, #ff5252);
  border-radius: 4px;
}

.controls {
  width: 96%;
  max-width: 900px;
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
@media (min-width: 640px) {
  .controls { grid-template-columns: repeat(6, 1fr); }
}
.btn {
  appearance: none;
  border: none;
  outline: none;
  padding: 10px 0;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.12);
  transition: all 0.15s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.96); }
.btn.primary {
  background: linear-gradient(135deg, #5c6bc0, #3949ab);
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(57,73,171,0.35);
}
.btn.active {
  background: linear-gradient(135deg, #43a047, #2e7d32);
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(46,125,50,0.35);
}
.btn.warn {
  background: linear-gradient(135deg, #e53935, #c62828);
  border-color: transparent;
}

.stats-bar {
  width: 96%;
  max-width: 900px;
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.stat-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 10px 4px;
  text-align: center;
}
.stat-label { font-size: 11px; color: #9fa8da; letter-spacing: 0.5px; }
.stat-num { font-size: 20px; font-weight: 700; color: #ffd54f; margin-top: 2px; }

.helper-text {
  margin-top: 8px;
  font-size: 12px;
  color: #72768e;
  text-align: center;
  width: 96%;
  max-width: 900px;
}
</style>
<script src="./data-bridge.js"></script>
</head>
<body>

<nav>
  <a href="index.html">← 返回首页</a>
  <h1>练习</h1>
  <span style="width:60px"></span>
</nav>

<div class="page">
  <div class="table-area" id="tableArea">
    <canvas id="snookerCanvas"></canvas>
    <div class="power-overlay" id="powerOverlay"><div class="power-fill" id="powerFill"></div></div>
  </div>

  <div class="controls">
    <button class="btn primary" id="btnReset">标准摆位</button>
    <button class="btn" id="btnClear">仅留白球</button>
    <button class="btn active" id="btnGuide">辅助线：开</button>
    <button class="btn" id="btnCustom">自定义：关</button>
    <button class="btn" id="btnAddRed">添加红球</button>
    <button class="btn warn" id="btnRemove">移除选中</button>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">击球次数</div>
      <div class="stat-num" id="stShots">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">总进球</div>
      <div class="stat-num" id="stPotted">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">单杆最高</div>
      <div class="stat-num" id="stMax">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">当前连击</div>
      <div class="stat-num" id="stCurrent">0</div>
    </div>
  </div>

  <div class="helper-text">
    提示：在球桌区域拖动白球周围即可瞄准与蓄力；开启自定义模式后可拖动任意球进行摆位。
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('snookerCanvas');
  const ctx = canvas.getContext('2d');
  const tableArea = document.getElementById('tableArea');
  const powerOverlay = document.getElementById('powerOverlay');
  const powerFill = document.getElementById('powerFill');

  let width = 0, height = 0;
  let ballRadius = 10;
  const CUSHION_W_RATIO = 2.6;
  let cushionW = 26;
  const FRICTION = 0.987;
  const STOP_SPEED = 0.04;
  const MAX_POWER = 22;
  const POCKET_MULT = 1.7;

  let balls = [];
  let pockets = [];
  let showGuide = true;
  let customMode = false;
  let draggingBall = null;
  let aiming = false;
  let aimAnchor = null;
  let aimNow = null;

  const PALETTE = {
    table: '#0b6623',
    cushion: '#5d4037',
    frame: '#3e2723',
    white:  '#f0f0f0',
    red:    '#e53935',
    yellow: '#fdd835',
    green:  '#43a047',
    brown:  '#8d6e63',
    blue:   '#1e88e5',
    pink:   '#f06292',
    black:  '#212121',
    pocket: '#0a0a0a',
    gold:   '#ffd54f'
  };

  const TYPE_POINTS = { white:0, red:1, yellow:2, green:3, brown:4, blue:5, pink:6, black:7 };
  const TYPE_COLOR = {
    white: PALETTE.white, red: PALETTE.red, yellow: PALETTE.yellow,
    green: PALETTE.green, brown: PALETTE.brown, blue: PALETTE.blue,
    pink: PALETTE.pink, black: PALETTE.black
  };

  let stats = { shots:0, potted:0, maxBreak:0, currentBreak:0 };

  function metrics() {
    cushionW = ballRadius * CUSHION_W_RATIO;
    const innerW = width - cushionW * 2;
    const innerH = height - cushionW * 2;
    return {
      cw: cushionW,
      iw: innerW,
      ih: innerH,
      cx: cushionW + innerW/2,
      cy: cushionW + innerH/2,
      baulk: cushionW + innerW*0.25,
      dRadius: innerW*0.085,
      blackX: cushionW + innerW*0.88,
      pinkX: cushionW + innerW*0.74
    };
  }

  function makeBall(x, y, type) {
    return {
      x, y, vx:0, vy:0,
      r: ballRadius,
      type,
      color: TYPE_COLOR[type],
      points: TYPE_POINTS[type] || 0,
      potted: false,
      id: Math.random().toString(36).slice(2)
    };
  }

  function buildPockets() {
    const m = metrics();
    pockets = [
      {x: m.cw, y: m.cw},
      {x: m.cx, y: m.cw},
      {x: m.cw + m.iw, y: m.cw},
      {x: m.cw, y: m.cw + m.ih},
      {x: m.cx, y: m.cw + m.ih},
      {x: m.cw + m.iw, y: m.cw + m.ih}
    ];
  }

  function standardLayout() {
    const m = metrics();
    balls = [];
    balls.push(makeBall(m.baulk, m.cy, 'brown'));
    balls.push(makeBall(m.baulk, m.cy - m.dRadius, 'green'));
    balls.push(makeBall(m.baulk, m.cy + m.dRadius, 'yellow'));
    balls.push(makeBall(m.cx, m.cy, 'blue'));
    balls.push(makeBall(m.pinkX, m.cy, 'pink'));
    balls.push(makeBall(m.blackX, m.cy, 'black'));

    const spacing = ballRadius * 2.08;
    const apexX = m.pinkX;
    const apexY = m.cy;
    for (let row = 0; row < 5; row++) {
      for (let col = 0; col <= row; col++) {
        const bx = apexX + row * spacing * 0.866;
        const by = apexY - (row * spacing * 0.5) + col * spacing;
        balls.push(makeBall(bx, by, 'red'));
      }
    }

    const wx = m.baulk - m.dRadius * 0.55;
    const wy = m.cy + (Math.random() - 0.5) * m.dRadius * 0.6;
    balls.push(makeBall(wx, wy, 'white'));
    saveLayout();
  }

  function clearToWhite() {
    const m = metrics();
    balls = balls.filter(b => b.type === 'white' && !b.potted);
    if (balls.length === 0) {
      balls.push(makeBall(m.baulk - m.dRadius*0.5, m.cy, 'white'));
    }
    saveLayout();
  }

  function resize() {
    const rect = tableArea.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const oldW = width, oldH = height;
    width = rect.width;
    height = rect.height;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ballRadius = Math.max(6, Math.min(width, height) * 0.018);
    buildPockets();

    if (oldW > 0 && oldH > 0 && balls.length) {
      const sx = width / oldW;
      const sy = height / oldH;
      balls.forEach(b => { b.x *= sx; b.y *= sy; b.r = ballRadius; });
    }
  }

  function allStopped() {
    return balls.every(b => b.potted || (Math.abs(b.vx) < STOP_SPEED && Math.abs(b.vy) < STOP_SPEED));
  }

  function updatePhysics() {
    if (customMode) return;
    for (let b of balls) {
      if (b.potted) continue;
      b.x += b.vx;
      b.y += b.vy;
      b.vx *= FRICTION;
      b.vy *= FRICTION;
      if (Math.abs(b.vx) < STOP_SPEED) b.vx = 0;
      if (Math.abs(b.vy) < STOP_SPEED) b.vy = 0;

      const m = metrics();
      const minX = m.cw + b.r;
      const maxX = m.cw + m.iw - b.r;
      const minY = m.cw + b.r;
      const maxY = m.cw + m.ih - b.r;

      if (b.x < minX) { b.x = minX; b.vx = Math.abs(b.vx) * 0.75; }
      if (b.x > maxX) { b.x = maxX; b.vx = -Math.abs(b.vx) * 0.75; }
      if (b.y < minY) { b.y = minY; b.vy = Math.abs(b.vy) * 0.75; }
      if (b.y > maxY) { b.y = maxY; b.vy = -Math.abs(b.vy) * 0.75; }

      for (let p of pockets) {
        const dx = b.x - p.x, dy = b.y - p.y;
        if (dx*dx + dy*dy < (b.r * POCKET_MULT)**2) {
          if (b.type !== 'white') {
            b.potted = true; b.vx = 0; b.vy = 0;
            stats.potted += 1;
            stats.currentBreak += b.points;
            if (stats.currentBreak > stats.maxBreak) stats.maxBreak = stats.currentBreak;
            updateStatsUI(); saveStats();
          } else {
            const mm = metrics();
            b.x = mm.baulk - mm.dRadius*0.55;
            b.y = mm.cy + (Math.random()-0.5)*20;
            b.vx = 0; b.vy = 0;
            stats.currentBreak = 0;
            updateStatsUI();
          }
          break;
        }
      }
    }

    for (let i = 0; i < balls.length; i++) {
      for (let j = i+1; j < balls.length; j++) {
        const a = balls[i], c = balls[j];
        if (a.potted || c.potted) continue;
        const dx = c.x - a.x, dy = c.y - a.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const minD = a.r + c.r;
        if (dist < minD && dist > 0.001) {
          const nx = dx/dist, ny = dy/dist;
          const dvx = c.vx - a.vx, dvy = c.vy - a.vy;
          const vel = dvx*nx + dvy*ny;
          if (vel > 0) continue;
          const imp = -(1.0 + 0.9) * vel * 0.5;
          a.vx -= imp * nx; a.vy -= imp * ny;
          c.vx += imp * nx; c.vy += imp * ny;
          const overlap = (minD - dist) * 0.5;
          a.x -= nx*overlap; a.y -= ny*overlap;
          c.x += nx*overlap; c.y += ny*overlap;
        }
      }
    }
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.scale(dpr, dpr);

    const m = metrics();

    ctx.fillStyle = PALETTE.frame;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = PALETTE.table;
    ctx.fillRect(m.cw, m.cw, m.iw, m.ih);

    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(m.baulk, m.cw); ctx.lineTo(m.baulk, m.cw+m.ih); ctx.stroke();
    ctx.beginPath(); ctx.arc(m.baulk, m.cy, m.dRadius, Math.PI/2, -Math.PI/2); ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    const spots = [
      [m.baulk, m.cy], [m.baulk, m.cy-m.dRadius], [m.baulk, m.cy+m.dRadius],
      [m.cx, m.cy], [m.pinkX, m.cy], [m.blackX, m.cy]
    ];
    spots.forEach(s => { ctx.beginPath(); ctx.arc(s[0], s[1], 3, 0, Math.PI*2); ctx.fill(); });

    pockets.forEach(p => {
      ctx.fillStyle = PALETTE.pocket;
      ctx.beginPath(); ctx.arc(p.x, p.y, ballRadius*POCKET_MULT, 0, Math.PI*2); ctx.fill();
    });

    ctx.fillStyle = PALETTE.cushion;
    ctx.fillRect(m.cw, 0, m.iw, m.cw);
    ctx.fillRect(m.cw, height-m.cw, m.iw, m.cw);
    ctx.fillRect(0, m.cw, m.cw, m.ih);
    ctx.fillRect(width-m.cw, m.cw, m.cw, m.ih);

    if (showGuide && !customMode && aiming && aimNow) {
      const white = balls.find(b => b.type === 'white' && !b.potted);
      if (white && aimAnchor) {
        const dx = aimNow.x - aimAnchor.x;
        const dy = aimNow.y - aimAnchor.y;
        const ang = Math.atan2(dy, dx) + Math.PI;
        const pow = Math.min(Math.sqrt(dx*dx+dy*dy), 220);
        const len = pow * 1.8;

        ctx.save();
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 2;

        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath(); ctx.moveTo(white.x, white.y); ctx.lineTo(white.x+Math.cos(ang)*len, white.y+Math.sin(ang)*len); ctx.stroke();

        let nearest = null, minT = Infinity;
        for (let b of balls) {
          if (b===white || b.potted) continue;
          const ex = Math.cos(ang), ey = Math.sin(ang);
          const ox = white.x - b.x, oy = white.y - b.y;
          const r = b.r*2;
          const a = 1, bq = 2*(ox*ex+oy*ey), c = ox*ox+oy*oy-r*r;
          const disc = bq*bq - 4*a*c;
          if (disc >= 0) {
            const t = (-bq - Math.sqrt(disc)) / 2;
            if (t > 0 && t < minT) { minT = t; nearest = b; }
          }
        }

        if (nearest) {
          const gx = white.x + Math.cos(ang)*minT;
          const gy = white.y + Math.sin(ang)*minT;
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.beginPath(); ctx.moveTo(white.x, white.y); ctx.lineTo(gx, gy); ctx.stroke();

          const tAng = Math.atan2(nearest.y-gy, nearest.x-gx);
          ctx.strokeStyle = 'rgba(255,215,0,0.65)';
          ctx.beginPath(); ctx.moveTo(nearest.x, nearest.y); ctx.lineTo(nearest.x+Math.cos(tAng)*70, nearest.y+Math.sin(tAng)*70); ctx.stroke();
        }
        ctx.restore();
      }
    }

    balls.forEach(b => {
      if (b.potted) return;
      ctx.beginPath(); ctx.arc(b.x+2, b.y+2, b.r, 0, Math.PI*2); ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fill();

      const grad = ctx.createRadialGradient(b.x-b.r*0.35, b.y-b.r*0.35, b.r*0.15, b.x, b.y, b.r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.25, b.color);
      grad.addColorStop(1, b.color);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.stroke();

      if (b.type !== 'white' && b.type !== 'red') {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = `bold ${Math.max(8, b.r)}px Arial`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const label = ({yellow:'2',green:'3',brown:'4',blue:'5',pink:'6',black:'7'})[b.type] || '';
        ctx.fillText(label, b.x, b.y+1);
      }
    });

    if (customMode && draggingBall) {
      ctx.strokeStyle = PALETTE.gold; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(draggingBall.x, draggingBall.y, draggingBall.r+5, 0, Math.PI*2); ctx.stroke();
    }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches && e.touches.length ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * (width / rect.width),
      y: (src.clientY - rect.top) * (height / rect.height)
    };
  }

  function onDown(e) {
    if (e.target !== canvas) return;
    const p = getPos(e);
    if (customMode) {
      for (let b of balls) {
        if (b.potted) continue;
        if ((b.x-p.x)**2 + (b.y-p.y)**2 < (b.r*1.8)**2) { draggingBall = b; return; }
      }
    } else {
      const white = balls.find(b => b.type === 'white' && !b.potted);
      if (white) {
        if ((white.x-p.x)**2 + (white.y-p.y)**2 < (white.r*4)**2) {
          aiming = true; aimAnchor = p; aimNow = p;
        }
      }
    }
  }

  function onMove(e) {
    if (e.target === canvas) e.preventDefault();
    const p = getPos(e);
    if (customMode && draggingBall) {
      const m = metrics();
      const b = draggingBall;
      b.x = Math.max(m.cw+b.r, Math.min(m.cw+m.iw-b.r, p.x));
      b.y = Math.max(m.cw+b.r, Math.min(m.cw+m.ih-b.r, p.y));
      for (let o of balls) {
        if (o===b || o.potted) continue;
        const dx = o.x-b.x, dy = o.y-b.y, dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < o.r+b.r && dist>0.001) {
          const ang = Math.atan2(dy,dx);
          b.x = o.x - Math.cos(ang)*(o.r+b.r);
          b.y = o.y - Math.sin(ang)*(o.r+b.r);
        }
      }
      saveLayout();
    } else if (aiming) {
      aimNow = p;
      const dx = p.x - aimAnchor.x, dy = p.y - aimAnchor.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      powerFill.style.width = Math.min((dist/220)*100, 100) + '%';
      powerOverlay.classList.add('visible');
    }
  }

  function onUp(e) {
    if (customMode) { draggingBall = null; return; }
    if (aiming) {
      const dx = aimNow.x - aimAnchor.x;
      const dy = aimNow.y - aimAnchor.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if (dist > 6) {
        const white = balls.find(b => b.type === 'white' && !b.potted);
        if (white) {
          const power = Math.min(dist*0.12, MAX_POWER);
          const ang = Math.atan2(dy,dx) + Math.PI;
          white.vx = Math.cos(ang)*power; white.vy = Math.sin(ang)*power;
          stats.shots += 1;
          stats.currentBreak = 0;
          updateStatsUI(); saveStats();
        }
      }
      aiming = false; aimAnchor = null; aimNow = null;
      powerOverlay.classList.remove('visible');
      powerFill.style.width = '0%';
    }
  }

  function addRedBall() {
    if (!customMode) { alert('请先开启“自定义”模式'); return; }
    const m = metrics();
    for (let i=0;i<80;i++) {
      const x = m.cw + ballRadius + Math.random()*(m.iw - ballRadius*2);
      const y = m.cw + ballRadius + Math.random()*(m.ih - ballRadius*2);
      let ok = true;
      for (let b of balls) { if (b.potted) continue; const d=(b.x-x)**2+(b.y-y)**2; if (d < (b.r*2.3)**2) { ok=false; break; } }
      if (ok) { balls.push(makeBall(x,y,'red')); saveLayout(); return; }
    }
    alert('球桌空间不足');
  }

  function removeSelected() {
    if (!customMode) { alert('请先开启“自定义”模式'); return; }
    if (draggingBall && draggingBall.type !== 'white') {
      balls = balls.filter(b => b !== draggingBall);
      draggingBall = null;
      saveLayout();
    } else {
      alert('请先点击选中要移除的球（不能移除白球）');
    }
  }

  function updateStatsUI() {
    document.getElementById('stShots').textContent = stats.shots;
    document.getElementById('stPotted').textContent = stats.potted;
    document.getElementById('stMax').textContent = stats.maxBreak;
    document.getElementById('stCurrent').textContent = stats.currentBreak;
  }

  function saveStats() {
    try { localStorage.setItem('kele_practice_stats', JSON.stringify(stats)); } catch(e){}
  }
  function loadStats() {
    try { const s = localStorage.getItem('kele_practice_stats'); if (s) stats = JSON.parse(s); } catch(e){}
    updateStatsUI();
  }
  function saveLayout() {
    try {
      const data = balls.map(b => ({x:b.x,y:b.y,type:b.type,potted:b.potted}));
      localStorage.setItem('kele_practice_layout', JSON.stringify(data));
    } catch(e){}
  }
  function loadLayout() {
    try {
      const s = localStorage.getItem('kele_practice_layout');
      if (!s) return false;
      const data = JSON.parse(s);
      if (!Array.isArray(data) || data.length===0) return false;
      balls = data.map(d => { const b=makeBall(d.x,d.y,d.type); b.potted=!!d.potted; return b; });
      return true;
    } catch(e){ return false; }
  }

  function bindUI() {
    document.getElementById('btnReset').addEventListener('click', () => { if(confirm('恢复为标准斯诺克开球摆位？')){ standardLayout(); stats.currentBreak=0; updateStatsUI(); } });
    document.getElementById('btnClear').addEventListener('click', () => { if(confirm('清空球桌，仅保留白球？')){ clearToWhite(); stats.currentBreak=0; updateStatsUI(); } });
    document.getElementById('btnGuide').addEventListener('click', () => {
      showGuide = !showGuide;
      const btn = document.getElementById('btnGuide');
      btn.textContent = showGuide ? '辅助线：开' : '辅助线：关';
      btn.classList.toggle('active', showGuide);
    });
    document.getElementById('btnCustom').addEventListener('click', () => {
      customMode = !customMode;
      const btn = document.getElementById('btnCustom');
      btn.textContent = customMode ? '自定义：开' : '自定义：关';
      btn.classList.toggle('active', customMode);
      canvas.style.cursor = customMode ? 'grab' : 'crosshair';
      balls.forEach(b => { b.vx = 0; b.vy = 0; });
      if (customMode) saveLayout();
    });
    document.getElementById('btnAddRed').addEventListener('click', addRedBall);
    document.getElementById('btnRemove').addEventListener('click', removeSelected);

    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', e => { onDown(e); if(e.target===canvas) e.preventDefault(); }, {passive:false});
    window.addEventListener('touchmove', e => { if (aiming || draggingBall) e.preventDefault(); onMove(e); }, {passive:false});
    window.addEventListener('touchend', onUp);

    window.addEventListener('resize', () => { resize(); draw(); });
  }

  function loop() {
    updatePhysics();
    draw();
    requestAnimationFrame(loop);
  }

  function init() {
    resize();
    if (!loadLayout()) standardLayout();
    loadStats();
    bindUI();
    loop();
  }

  init();
})();
</script>
</body>
</html>
