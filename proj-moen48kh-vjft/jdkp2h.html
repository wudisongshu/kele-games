<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>战绩</title>
    <style>
        :root {
            --bg-deep: #070b14;
            --bg-card: rgba(20, 28, 45, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #00d084;
            --accent-gold: #ffd700;
            --accent-red: #ff4757;
            --accent-blue: #3498db;
            --win: #2ecc71;
            --loss: #e74c3c;
            --draw: #f1c40f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(ellipse at top, #0f1c32 0%, #070b14 100%);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(7, 11, 20, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 20px;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
            padding: 8px 0;
        }

        .back-btn:hover {
            color: var(--text);
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-links a.active {
            color: var(--accent);
            background: rgba(0, 208, 132, 0.1);
            font-weight: 500;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* 统计概览 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .stat-card.total .stat-value { color: var(--text); }
        .stat-card.winrate .stat-value { color: var(--accent); }
        .stat-card.century .stat-value { color: var(--accent-gold); }
        .stat-card.highest .stat-value { color: var(--accent-red); }

        .stat-delta {
            font-size: 12px;
            margin-top: 6px;
            color: var(--text-muted);
        }

        /* 主网格 */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 图表 */
        .chart-container {
            position: relative;
            height: 240px;
            width: 100%;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* 历史对局 */
        .history-list {
            max-height: 360px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .history-opponent {
            font-size: 14px;
            font-weight: 500;
        }

        .history-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .history-score-wrap {
            text-align: right;
        }

        .history-score {
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .history-result {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;
            font-weight: 600;
        }

        .result-win { background: rgba(46, 204, 113, 0.15); color: var(--win); }
        .result-loss { background: rgba(231, 76, 60, 0.15); color: var(--loss); }
        .result-draw { background: rgba(241, 196, 15, 0.15); color: var(--draw); }

        /* 排行榜 */
        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .lb-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            transition: background 0.2s;
        }

        .lb-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .lb-rank {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .lb-rank.top1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #332200; }
        .lb-rank.top2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #222; }
        .lb-rank.top3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: #fff; }
        .lb-rank.other { background: rgba(255,255,255,0.08); color: var(--text-muted); }

        .lb-detail {
            flex: 1;
            min-width: 0;
        }

        .lb-score {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .lb-opponent {
            font-size: 12px;
            color: var(--text-muted);
        }

        .lb-date {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* 成就 */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .achievement {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            transition: all 0.3s;
        }

        .achievement.unlocked {
            border-color: rgba(0, 208, 132, 0.3);
            background: rgba(0, 208, 132, 0.05);
        }

        .achievement.locked {
            opacity: 0.5;
        }

        .achievement-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }

        .achievement-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .achievement-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .achievement-lock {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 14px;
        }

        /* 按钮与操作 */
        .btn {
            background: linear-gradient(135deg, var(--accent), #00a86b);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* 悬浮按钮 */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-blue));
            color: #fff;
            border: none;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 208, 132, 0.3);
            transition: transform 0.2s;
            z-index: 90;
        }

        .fab:active {
            transform: scale(0.9);
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input, .form-select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .radio-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .radio-option {
            flex: 1;
            min-width: 80px;
        }

        .radio-option input {
            display: none;
        }

        .radio-option label {
            display: block;
            text-align: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .radio-option input:checked + label {
            background: rgba(0, 208, 132, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions .btn {
            flex: 1;
            justify-content: center;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .nav-links {
                display: none;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .stat-value {
                font-size: 22px;
            }
            .achievements-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.5s ease both;
        }

        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
    </style>
<script src="./data-bridge.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-inner">
            <div class="nav-left">
                <a href="index.html" class="back-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    返回首页
                </a>
                <div class="nav-title">战绩中心</div>
            </div>
            <div class="nav-links">
                <a href="practice.html">练习</a>
                <a href="match.html">对战</a>
                <a href="rules.html">规则</a>
                <a href="records.html" class="active">战绩</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">总对局数</div>
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-delta">累计场次</div>
            </div>
            <div class="stat-card winrate">
                <div class="stat-label">胜率</div>
                <div class="stat-value" id="statWinRate">0%</div>
                <div class="stat-delta" id="statWinLoss">0胜 / 0负</div>
            </div>
            <div class="stat-card century">
                <div class="stat-label">破百次数</div>
                <div class="stat-value" id="statCenturies">0</div>
                <div class="stat-delta">单杆 ≥100 分</div>
            </div>
            <div class="stat-card highest">
                <div class="stat-label">单杆最高分</div>
                <div class="stat-value" id="statHighest">0</div>
                <div class="stat-delta">历史最佳</div>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-sm" onclick="app.openModal()">＋ 记录对局</button>
            <button class="btn btn-secondary btn-sm" onclick="app.resetData()">⟲ 重置演示数据</button>
        </div>

        <div class="main-grid">
            <div class="left-column">
                <div class="card">
                    <div class="card-title"><span>📈 胜率趋势（近12场滚动）</span></div>
                    <div class="chart-container">
                        <canvas id="winRateChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><span>🎱 历史对局</span><span style="font-size:12px;color:var(--text-muted);" id="historyCount">0 场</span></div>
                    <div class="history-list" id="historyList"></div>
                </div>
            </div>

            <div class="right-column">
                <div class="card">
                    <div class="card-title"><span>🏆 单杆最高分榜</span></div>
                    <div class="leaderboard" id="leaderboard"></div>
                </div>

                <div class="card">
                    <div class="card-title"><span>🥇 成就徽章</span><span style="font-size:12px;color:var(--accent);" id="achieveCount">0/8</span></div>
                    <div class="achievements-grid" id="achievementsGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="fab" id="fabBtn" aria-label="添加对局">+</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">记录新对局</div>
            <div class="form-group">
                <label class="form-label">对手</label>
                <select class="form-select" id="inputOpponent">
                    <option value="电脑（简单）">电脑（简单）</option>
                    <option value="电脑（困难）">电脑（困难）</option>
                    <option value="玩家2">玩家2</option>
                    <option value="好友对战">好友对战</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">比赛结果</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" name="result" value="win" id="resWin" checked>
                        <label for="resWin">胜利</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="result" value="loss" id="resLoss">
                        <label for="resLoss">失利</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="result" value="draw" id="resDraw">
                        <label for="resDraw">平局</label>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">我的局分</label>
                    <input type="number" class="form-input" id="inputMyScore" value="3" min="0" max="99">
                </div>
                <div class="form-group">
                    <label class="form-label">对手局分</label>
                    <input type="number" class="form-input" id="inputOpScore" value="1" min="0" max="99">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">本场单杆最高分</label>
                <input type="number" class="form-input" id="inputBreak" value="45" min="0" max="147">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="app.saveMatch()">保存记录</button>
                <button class="btn btn-secondary" onclick="app.closeModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        const KEYS = {
            MATCHES: 'kele_match_history',
            STATS: 'kele_player_stats',
            BREAKS: 'kele_highest_breaks',
            ACHIEVE: 'kele_achievements'
        };

        const ACHIEVEMENTS = [
            { id: 'rookie', name: '初出茅庐', desc: '完成首场比赛', icon: '🎱' },
            { id: 'first_win', name: '旗开得胜', desc: '获得首场胜利', icon: '🏆' },
            { id: 'century', name: '破百大师', desc: '单杆突破100分', icon: '💯' },
            { id: 'max147', name: '满分杆', desc: '打出单杆147分', icon: '👑' },
            { id: 'veteran', name: '百战老兵', desc: '累计完成100场比赛', icon: '⚔️' },
            { id: 'master', name: '常胜将军', desc: '胜率超60%且≥20场', icon: '📈' },
            { id: 'century10', name: '百分常客', desc: '累计10次单杆破百', icon: '🔥' },
            { id: 'streak3', name: '连胜王者', desc: '取得3连胜', icon: '⚡' }
        ];

        class App {
            constructor() {
                this.data = { matches: [], stats: null, breaks: [], achievements: {} };
                this.init();
            }

            init() {
                this.load();
                if (!this.data.stats || this.data.matches.length === 0) {
                    this.seedDemoData();
                }
                this.refreshUI();
                this.bindEvents();
            }

            load() {
                try {
                    const m = localStorage.getItem(KEYS.MATCHES);
                    const s = localStorage.getItem(KEYS.STATS);
                    const b = localStorage.getItem(KEYS.BREAKS);
                    const a = localStorage.getItem(KEYS.ACHIEVE);
                    if (m) this.data.matches = JSON.parse(m);
                    if (s) this.data.stats = JSON.parse(s);
                    if (b) this.data.breaks = JSON.parse(b);
                    if (a) this.data.achievements = JSON.parse(a);
                } catch (e) {
                    this.seedDemoData();
                }
            }

            save() {
                try {
                    localStorage.setItem(KEYS.MATCHES, JSON.stringify(this.data.matches));
                    localStorage.setItem(KEYS.STATS, JSON.stringify(this.data.stats));
                    localStorage.setItem(KEYS.BREAKS, JSON.stringify(this.data.breaks));
                    localStorage.setItem(KEYS.ACHIEVE, JSON.stringify(this.data.achievements));
                } catch (e) {
                    // 隐私模式下静默处理
                }
            }

            seedDemoData() {
                const opponents = ['电脑（简单）', '电脑（困难）', '玩家2', '好友对战'];
                const results = ['win', 'win', 'win', 'loss', 'win', 'loss', 'win', 'win', 'draw', 'win', 'loss', 'win', 'win', 'win', 'loss'];
                const scores = [['3','1'],['4','2'],['2','0'],['1','3'],['3','2'],['0','2'],['4','1'],['3','1'],['2','2'],['4','3'],['2','4'],['3','0'],['4','0'],['3','1'],['1','4']];
                const breaks = [45, 78, 112, 34, 56, 89, 134, 45, 67, 120, 23, 147, 56, 89, 44];

                this.data.matches = [];
                const now = new Date();
                for (let i = 0; i < 15; i++) {
                    const date = new Date(now);
                    date.setDate(date.getDate() - (15 - i));
                    this.data.matches.push({
                        id: Date.now() + i,
                        date: date.toISOString().split('T')[0],
                        opponent: opponents[i % opponents.length],
                        result: results[i],
                        myScore: parseInt(scores[i][0]),
                        opScore: parseInt(scores[i][1]),
                        myBreak: breaks[i]
                    });
                }

                this.data.stats = {
                    totalMatches: 15,
                    wins: 10,
                    losses: 4,
                    draws: 1,
                    centuries: 4,
                    highestBreak: 147,
                    winRateHistory: [50, 55, 52, 60, 55, 50, 53, 57, 55, 58, 56, 60, 62, 63, 67]
                };

                this.data.breaks = [
                    { score: 147, date: this.data.matches[11].date, opponent: this.data.matches[11].opponent },
                    { score: 134, date: this.data.matches[6].date, opponent: this.data.matches[6].opponent },
                    { score: 120, date: this.data.matches[9].date, opponent: this.data.matches[9].opponent },
                    { score: 112, date: this.data.matches[2].date, opponent: this.data.matches[2].opponent },
                    { score: 89, date: this.data.matches[5].date, opponent: this.data.matches[5].opponent },
                    { score: 89, date: this.data.matches[13].date, opponent: this.data.matches[13].opponent },
                    { score: 78, date: this.data.matches[1].date, opponent: this.data.matches[1].opponent },
                    { score: 67, date: this.data.matches[8].date, opponent: this.data.matches[8].opponent },
                    { score: 56, date: this.data.matches[4].date, opponent: this.data.matches[4].opponent },
                    { score: 56, date: this.data.matches[12].date, opponent: this.data.matches[12].opponent }
                ];

                this.data.achievements = {};
                this.checkAchievements();
                this.save();
            }

            resetData() {
                if (confirm('确定要重置为演示数据吗？当前记录将被覆盖。')) {
                    this.seedDemoData();
                    this.refreshUI();
                }
            }

            checkAchievements() {
                const s = this.data.stats || { totalMatches: 0, wins: 0, losses: 0, draws: 0, centuries: 0, highestBreak: 0 };
                const matches = this.data.matches || [];
                let streak = 0, maxStreak = 0;
                for (const m of matches) {
                    if (m.result === 'win') { streak++; maxStreak = Math.max(maxStreak, streak); }
                    else { streak = 0; }
                }
                const winRate = s.totalMatches > 0 ? s.wins / s.totalMatches : 0;

                const checks = {
                    rookie: s.totalMatches >= 1,
                    first_win: s.wins >= 1,
                    century: s.highestBreak >= 100,
                    max147: s.highestBreak >= 147,
                    veteran: s.totalMatches >= 100,
                    master: s.totalMatches >= 20 && winRate >= 0.6,
                    century10: s.centuries >= 10,
                    streak3: maxStreak >= 3
                };

                let changed = false;
                for (const [k, v] of Object.entries(checks)) {
                    if (v && !this.data.achievements[k]) {
                        this.data.achievements[k] = { unlocked: true, date: new Date().toISOString().split('T')[0] };
                        changed = true;
                    }
                }
                if (changed) this.save();
            }

            addMatch(match) {
                match.id = Date.now();
                this.data.matches.unshift(match);
                const s = this.data.stats;
                s.totalMatches++;
                if (match.result === 'win') s.wins++;
                else if (match.result === 'loss') s.losses++;
                else s.draws++;

                if (match.myBreak >= 100) s.centuries++;
                if (match.myBreak > s.highestBreak) s.highestBreak = match.myBreak;

                if (match.myBreak > 0) {
                    this.data.breaks.push({ score: match.myBreak, date: match.date, opponent: match.opponent });
                    this.data.breaks.sort((a, b) => b.score - a.score);
                }

                const wr = Math.round((s.wins / s.totalMatches) * 100);
                s.winRateHistory.push(wr);
                if (s.winRateHistory.length > 12) s.winRateHistory.shift();

                this.checkAchievements();
                this.save();
                this.refreshUI();
            }

            refreshUI() {
                this.renderOverview();
                this.renderChart();
                this.renderHistory();
                this.renderLeaderboard();
                this.renderAchievements();
            }

            renderOverview() {
                const s = this.data.stats;
                document.getElementById('statTotal').textContent = s.totalMatches;
                const wr = s.totalMatches > 0 ? Math.round((s.wins / s.totalMatches) * 100) : 0;
                document.getElementById('statWinRate').textContent = wr + '%';
                document.getElementById('statWinLoss').textContent = `${s.wins}胜 / ${s.losses}负`;
                document.getElementById('statCenturies').textContent = s.centuries;
                document.getElementById('statHighest').textContent = s.highestBreak;
            }

            renderHistory() {
                const list = document.getElementById('historyList');
                list.innerHTML = '';
                document.getElementById('historyCount').textContent = this.data.matches.length + ' 场';

                const recent = this.data.matches.slice(0, 20);
                for (const m of recent) {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    const resClass = m.result === 'win' ? 'result-win' : (m.result === 'loss' ? 'result-loss' : 'result-draw');
                    const resText = m.result === 'win' ? '胜利' : (m.result === 'loss' ? '失利' : '平局');
                    item.innerHTML = `
                        <div class="history-info">
                            <div class="history-opponent">vs ${m.opponent}</div>
                            <div class="history-meta">${m.date} · 单杆 ${m.myBreak}分</div>
                        </div>
                        <div class="history-score-wrap">
                            <div class="history-score">${m.myScore} - ${m.opScore}</div>
                            <span class="history-result ${resClass}">${resText}</span>
                        </div>
                    `;
                    list.appendChild(item);
                }
            }

            renderLeaderboard() {
                const board = document.getElementById('leaderboard');
                board.innerHTML = '';
                const tops = this.data.breaks.slice(0, 8);
                if (tops.length === 0) {
                    board.innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:10px;">暂无记录</div>';
                    return;
                }
                tops.forEach((b, idx) => {
                    const row = document.createElement('div');
                    row.className = 'lb-item';
                    const rankClass = idx === 0 ? 'top1' : (idx === 1 ? 'top2' : (idx === 2 ? 'top3' : 'other'));
                    row.innerHTML = `
                        <div class="lb-rank ${rankClass}">${idx + 1}</div>
                        <div class="lb-detail">
                            <div class="lb-score">${b.score}分</div>
                            <div class="lb-opponent">vs ${b.opponent}</div>
                        </div>
                        <div class="lb-date">${b.date}</div>
                    `;
                    board.appendChild(row);
                });
            }

            renderAchievements() {
                const grid = document.getElementById('achievementsGrid');
                grid.innerHTML = '';
                let unlockedCount = 0;
                ACHIEVEMENTS.forEach(ach => {
                    const data = this.data.achievements[ach.id];
                    const isUnlocked = !!data;
                    if (isUnlocked) unlockedCount++;
                    const el = document.createElement('div');
                    el.className = 'achievement ' + (isUnlocked ? 'unlocked' : 'locked');
                    el.innerHTML = `
                        <span class="achievement-icon">${ach.icon}</span>
                        <div class="achievement-name">${ach.name}</div>
                        <div class="achievement-desc">${ach.desc}</div>
                        ${isUnlocked ? '' : '<span class="achievement-lock">🔒</span>'}
                    `;
                    grid.appendChild(el);
                });
                document.getElementById('achieveCount').textContent = `${unlockedCount}/${ACHIEVEMENTS.length}`;
            }

            renderChart() {
                const canvas = document.getElementById('winRateChart');
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);

                const data = (this.data.stats.winRateHistory || []).slice(-12);
                if (data.length < 2) {
                    ctx.clearRect(0, 0, rect.width, rect.height);
                    ctx.fillStyle = '#64748b';
                    ctx.font = '13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('数据不足，请至少进行2场对局', rect.width / 2, rect.height / 2);
                    return;
                }

                const pad = { top: 20, right: 20, bottom: 30, left: 36 };
                const W = rect.width - pad.left - pad.right;
                const H = rect.height - pad.top - pad.bottom;
                const n = data.length;

                ctx.clearRect(0, 0, rect.width, rect.height);

                // 网格
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 4; i++) {
                    const y = pad.top + (H / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(pad.left, y);
                    ctx.lineTo(pad.left + W, y);
                    ctx.stroke();
                    const val = 100 - i * 25;
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = '11px sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(val + '%', pad.left - 8, y + 3);
                }

                // 折线
                const getX = (i) => pad.left + (W / (n - 1)) * i;
                const getY = (v) => pad.top + H - (v / 100) * H;

                // 填充渐变
                const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + H);
                grad.addColorStop(0, 'rgba(0, 208, 132, 0.25)');
                grad.addColorStop(1, 'rgba(0, 208, 132, 0.0)');
                ctx.beginPath();
                ctx.moveTo(getX(0), getY(data[0]));
                for (let i = 1; i < n; i++) ctx.lineTo(getX(i), getY(data[i]));
                ctx.lineTo(getX(n - 1), pad.top + H);
                ctx.lineTo(getX(0), pad.top + H);
                ctx.closePath();
                ctx.fillStyle = grad;
                ctx.fill();

                // 线
                ctx.beginPath();
                ctx.moveTo(getX(0), getY(data[0]));
                for (let i = 1; i < n; i++) {
                    const xc = (getX(i - 1) + getX(i)) / 2;
                    const yc = (getY(data[i - 1]) + getY(data[i])) / 2;
                    ctx.quadraticCurveTo(getX(i - 1), getY(data[i - 1]), xc, yc);
                    ctx.quadraticCurveTo(getX(i), getY(data[i]), getX(i), getY(data[i]));
                }
                ctx.strokeStyle = '#00d084';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // 点
                for (let i = 0; i < n; i++) {
                    const x = getX(i);
                    const y = getY(data[i]);
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#0f172a';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#00d084';
                    ctx.stroke();
                }

                // X轴标签
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                const step = n <= 6 ? 1 : Math.ceil(n / 6);
                for (let i = 0; i < n; i += step) {
                    ctx.fillText(i + 1, getX(i), pad.top + H + 16);
                }
            }

            openModal() {
                document.getElementById('modalOverlay').classList.add('active');
                document.getElementById('inputOpponent').value = '电脑（简单）';
                document.getElementById('resWin').checked = true;
                document.getElementById('inputMyScore').value = 3;
                document.getElementById('inputOpScore').value = 1;
                document.getElementById('inputBreak').value = 45;
            }

            closeModal() {
                document.getElementById('modalOverlay').classList.remove('active');
            }

            saveMatch() {
                const opponent = document.getElementById('inputOpponent').value;
                const result = document.querySelector('input[name="result"]:checked').value;
                const myScore = parseInt(document.getElementById('inputMyScore').value) || 0;
                const opScore = parseInt(document.getElementById('inputOpScore').value) || 0;
                const myBreak = parseInt(document.getElementById('inputBreak').value) || 0;

                if (myBreak > 147) {
                    alert('单杆最高分不能超过147分');
                    return;
                }

                const match = {
                    date: new Date().toISOString().split('T')[0],
                    opponent,
                    result,
                    myScore,
                    opScore,
                    myBreak
                };
                this.addMatch(match);
                this.closeModal();
            }

            bindEvents() {
                document.getElementById('fabBtn').addEventListener('click', () => this.openModal());
                document.getElementById('modalOverlay').addEventListener('click', (e) => {
                    if (e.target.id === 'modalOverlay') this.closeModal();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') this.closeModal();
                });
                window.addEventListener('resize', () => this.renderChart());
            }
        }

        const app = new App();
    </script>
</body>
</html>
