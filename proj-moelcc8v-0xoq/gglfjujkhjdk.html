<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单人挑战</title>
    <style>
        /* ─── RESET & BASE ─── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0f1117;
            color: #e4e6eb;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        a { text-decoration: none; color: inherit; }

        /* ─── HEADER / NAV ─── */
        .top-nav {
            height: 52px;
            background: linear-gradient(180deg, #1a1d24 0%, #13151a 100%);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 50;
        }
        .top-nav .left { display: flex; align-items: center; gap: 12px; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #8b92a8;
            transition: color 0.2s;
            cursor: pointer;
        }
        .back-link:hover { color: #ffffff; }
        .back-link svg { width: 16px; height: 16px; fill: currentColor; }
        .page-title {
            font-size: 16px;
            font-weight: 600;
            color: #f0f2f5;
            letter-spacing: 0.5px;
        }
        .nav-right { display: flex; align-items: center; gap: 14px; }
        .nav-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #a0a8c0;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

        /* ─── MAIN GAME AREA ─── */
        .game-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .score-panel {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18,20,26,0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px 28px;
            display: flex;
            align-items: center;
            gap: 28px;
            z-index: 40;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        .score-item { text-align: center; }
        .score-label {
            font-size: 10px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }
        .score-value {
            font-size: 22px;
            font-weight: 700;
            color: #fbbf24;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .score-divider {
            width: 1px;
            height: 32px;
            background: rgba(255,255,255,0.08);
        }
        .score-value.small { font-size: 16px; color: #e4e6eb; }

        canvas#gameCanvas {
            display: block;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            cursor: crosshair;
        }

        /* ─── POWER METER ─── */
        .power-meter-wrap {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .power-meter-wrap.visible { opacity: 1; }
        .power-label { font-size: 11px; color: #9ca3af; letter-spacing: 1px; }
        .power-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.08);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .power-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            border-radius: 5px;
            transition: width 0.05s linear;
        }

        /* ─── MESSAGE TOAST ─── */
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(18,20,26,0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #f0f2f5;
            z-index: 60;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .toast.success { color: #4ade80; border-color: rgba(74,222,128,0.3); }
        .toast.error   { color: #f87171; border-color: rgba(248,113,113,0.3); }
        .toast.info    { color: #60a5fa; border-color: rgba(96,165,250,0.3); }

        /* ─── FOOTER ─── */
        .footer-hint {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255,255,255,0.25);
            z-index: 30;
            pointer-events: none;
            white-space: nowrap;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 640px) {
            .score-panel { gap: 16px; padding: 8px 18px; top: 10px; }
            .score-value { font-size: 18px; }
            .power-meter-wrap { width: 220px; }
        }
    </style>
<script src="./data-bridge.js"></script>
</head>
<body>

    <!-- HEADER -->
    <nav class="top-nav">
        <div class="left">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                返回首页
            </a>
            <span class="page-title">单人挑战</span>
        </div>
        <div class="nav-right">
            <button class="nav-btn" id="resetBtn">重新开始</button>
            <button class="nav-btn" id="rulesBtn">规则</button>
        </div>
    </nav>

    <!-- GAME AREA -->
    <div class="game-wrapper">
        <div class="score-panel" id="scorePanel">
            <div class="score-item">
                <div class="score-label">得分</div>
                <div class="score-value" id="scoreDisplay">0</div>
            </div>
            <div class="score-divider"></div>
            <div class="score-item">
                <div class="score-label">红球剩余</div>
                <div class="score-value small" id="redsDisplay">15</div>
            </div>
            <div class="score-divider"></div>
            <div class="score-item">
                <div class="score-label">单杆最高</div>
                <div class="score-value small" id="breakDisplay">0</div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="power-meter-wrap" id="powerWrap">
            <div class="power-label">击球力度</div>
            <div class="power-bar-bg">
                <div class="power-bar-fill" id="powerFill"></div>
            </div>
        </div>

        <div class="toast" id="toast"></div>
        <div class="footer-hint">拖拽鼠标瞄准，松开击球 · 支持触屏操作</div>
    </div>

<script>
(function() {
    'use strict';

    /* ─── CONSTANTS ─── */
    const BALL_RADIUS   = 10;
    const BALL_DIAMETER = BALL_RADIUS * 2;
    const POCKET_RADIUS = 18;
    const WALL_THICK    = 34;
    const WOOD_MARGIN   = 14;
    const FRICTION      = 0.985;
    const MIN_VELOCITY  = 0.08;
    const MAX_POWER     = 16;
    const COLORS = {
        white:  '#f4f4f5', red:    '#ef4444', yellow: '#fbbf24',
        green:  '#22c55e', brown:  '#a16207', blue:   '#2563eb',
        pink:   '#ec4899', black:  '#18181b',
        cloth:  '#1e5631', cushion:'#7c3f1a', wood:   '#3d2b1f',
        pocket: '#0b0c10'
    };

    /* ─── GAME STATE ─── */
    const canvas  = document.getElementById('gameCanvas');
    const ctx     = canvas.getContext('2d');
    const powerWrap = document.getElementById('powerWrap');
    const powerFill = document.getElementById('powerFill');
    const toastEl   = document.getElementById('toast');

    let TABLE_W, TABLE_H, TOTAL_W, TOTAL_H;
    let balls = [];
    let pockets = [];
    let isAiming = false;
    let aimStart = null;
    let aimCurrent = null;
    let ballsMoving = false;
    let animating = false;
    let mouseInCanvas = false;
    let lastMousePos = { x: 0, y: 0 };

    /* Scoring state */
    let totalScore = 0;
    let currentBreak = 0;
    let redsRemaining = 15;
    let nextBallColor = 'red'; // 'red' or a color name (phase-based)
    let gamePhase = 'reds';    // 'reds', 'colors', 'done'
    let cueBallPotted = false;
    let freeBallPos = null;    // position to place cue ball after foul

    /* ─── TABLE GEOMETRY ─── */
    function calcTableSize() {
        const navH = 52;
        const availW = window.innerWidth  - 20;
        const availH = window.innerHeight - navH - 20;
        const ratio = 2; // snooker table 2:1
        let w = availW, h = w / ratio;
        if (h > availH) { h = availH; w = h * ratio; }
        TABLE_W  = Math.floor(w);
        TABLE_H  = Math.floor(h);
        TOTAL_W  = TABLE_W + WALL_THICK * 2;
        TOTAL_H  = TABLE_H + WALL_THICK * 2;
        canvas.width  = TOTAL_W;
        canvas.height = TOTAL_H;
        buildPockets();
    }

    function buildPockets() {
        pockets = [
            { x: WALL_THICK,                  y: WALL_THICK,                  r: POCKET_RADIUS },
            { x: TOTAL_W / 2,                 y: WALL_THICK - 2,              r: POCKET_RADIUS },
            { x: TOTAL_W - WALL_THICK,        y: WALL_THICK,                  r: POCKET_RADIUS },
            { x: WALL_THICK,                  y: TOTAL_H - WALL_THICK,        r: POCKET_RADIUS },
            { x: TOTAL_W / 2,                 y: TOTAL_H - WALL_THICK + 2,    r: POCKET_RADIUS },
            { x: TOTAL_W - WALL_THICK,        y: TOTAL_H - WALL_THICK,        r: POCKET_RADIUS },
        ];
    }

    /* ─── BALL CLASS ─── */
    class Ball {
        constructor(id, color, value, x, y) {
            this.id = id;
            this.color = color;
            this.value = value;
            this.x = x;
            this.y = y;
            this.vx = 0;
            this.vy = 0;
            this.active = true;
            this.potted = false;
        }
    }

    /* Standard starting positions (scaled to current table) */
    function scaleX(v) { return WALL_THICK + (v / 760) * TABLE_W; }
    function scaleY(v) { return WALL_THICK + (v / 380) * TABLE_H; }

    function initBalls() {
        balls = [];
        // White (cue)
        balls.push(new Ball(0, 'white', 0, scaleX(180), scaleY(190)));

        // Colors
        balls.push(new Ball(1, 'yellow', 2,  scaleX(760*0.12), scaleY(380*0.73))); // near green spot
        balls.push(new Ball(2, 'green',  3,  scaleX(760*0.12), scaleY(380*0.27)));
        balls.push(new Ball(3, 'brown',  4,  scaleX(760*0.12), scaleY(190)));
        balls.push(new Ball(4, 'blue',   5,  scaleX(380),      scaleY(190)));
        balls.push(new Ball(5, 'pink',   6,  scaleX(570),      scaleY(190)));
        balls.push(new Ball(6, 'black',  7,  scaleX(680),      scaleY(190)));

        // Reds - triangle
        const apexX = scaleX(630), apexY = scaleY(190), gap = BALL_DIAMETER * 0.96;
        let rID = 7, row = 0, placed = 0;
        for (let i = 0; i < 15; i++) {
            const cx = apexX + row * gap * 0.866;
            const cy = apexY + (placed - row/2) * gap;
            balls.push(new Ball(rID++, 'red', 1, cx, cy));
            placed++;
            if (placed > row) { row++; placed = 0; }
        }

        redsRemaining = 15;
        gamePhase = 'reds';
        nextBallColor = 'red';
        totalScore = 0;
        currentBreak = 0;
        cueBallPotted = false;
        freeBallPos = null;
        updateScoreboard();
        showToast('单人练习模式', 'info', 1500);
    }

    /* ─── PHYSICS ─── */
    function updatePhysics() {
        let moving = false;
        for (const b of balls) {
            if (!b.active) continue;
            b.x += b.vx; b.y += b.vy;
            b.vx *= FRICTION; b.vy *= FRICTION;
            if (Math.abs(b.vx) < MIN_VELOCITY) b.vx = 0;
            if (Math.abs(b.vy) < MIN_VELOCITY) b.vy = 0;
            if (b.vx !== 0 || b.vy !== 0) moving = true;
        }
        resolveWallCollisions();
        resolveBallCollisions();
        resolvePockets();
        ballsMoving = moving;
        return moving;
    }

    function resolveWallCollisions() {
        const left   = WALL_THICK + BALL_RADIUS;
        const right  = TOTAL_W - WALL_THICK - BALL_RADIUS;
        const top    = WALL_THICK + BALL_RADIUS;
        const bottom = TOTAL_H - WALL_THICK - BALL_RADIUS;
        for (const b of balls) {
            if (!b.active) continue;
            if (b.x < left)   { b.x = left;   b.vx = Math.abs(b.vx) * 0.7; }
            if (b.x > right)  { b.x = right;  b.vx = -Math.abs(b.vx) * 0.7; }
            if (b.y < top)    { b.y = top;    b.vy = Math.abs(b.vy) * 0.7; }
            if (b.y > bottom) { b.y = bottom; b.vy = -Math.abs(b.vy) * 0.7; }
        }
    }

    function resolveBallCollisions() {
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                const a = balls[i], b = balls[j];
                if (!a.active || !b.active) continue;
                const dx = b.x - a.x, dy = b.y - a.y;
                const dist = Math.hypot(dx, dy);
                if (dist < BALL_DIAMETER && dist > 0.1) {
                    const nx = dx / dist, ny = dy / dist;
                    const tx = -ny, ty = nx;
                    const dpa = a.vx * nx + a.vy * ny;
                    const dpb = b.vx * nx + b.vy * ny;
                    const dta = a.vx * tx + a.vy * ty;
                    const dtb = b.vx * tx + b.vy * ty;
                    const ma = 1, mb = 1;
                    const mTot = ma + mb;
                    const newDpa = (dpa * (ma - mb) + 2 * mb * dpb) / mTot;
                    const newDpb = (dpb * (mb - ma) + 2 * ma * dpa) / mTot;
                    a.vx = tx * dta + nx * newDpa;
                    a.vy = ty * dta + ny * newDpa;
                    b.vx = tx * dtb + nx * newDpb;
                    b.vy = ty * dtb + ny * newDpb;
                    // Separate to prevent overlap
                    const overlap = BALL_DIAMETER - dist;
                    const sepX = nx * overlap * 0.5;
                    const sepY = ny * overlap * 0.5;
                    a.x -= sepX; a.y -= sepY;
                    b.x += sepX; b.y += sepY;
                }
            }
        }
    }

    function resolvePockets() {
        for (const p of pockets) {
            for (const b of balls) {
                if (!b.active) continue;
                if (Math.hypot(b.x - p.x, b.y - p.y) < p.r * 0.85) {
                    handlePotted(b);
                }
            }
        }
    }

    /* ─── SCORING LOGIC ─── */
    function handlePotted(b) {
        b.active = false;
        b.potted = true;
        if (b.color === 'white') {
            cueBallPotted = true;
            b.vx = 0; b.vy = 0;
            showToast('白球落袋！罚4分', 'error', 2000);
            totalScore = Math.max(0, totalScore - 4);
            currentBreak = 0;
            updateScoreboard();
            return;
        }
        if (b.color === 'red') {
            if (gamePhase === 'reds' && nextBallColor === 'red') {
                totalScore += 1;
                currentBreak += 1;
                redsRemaining--;
                if (redsRemaining === 0) {
                    gamePhase = 'colors';
                    nextBallColor = 'yellow';
                    showToast('红球清台！开始收彩', 'info', 2000);
                } else {
                    nextBallColor = 'color';
                }
                updateScoreboard();
                showToast('+1 红球', 'success', 800);
            } else {
                // Foul: hit wrong ball
                foul('误进红球');
            }
        } else {
            // Color ball
            if (gamePhase === 'reds') {
                if (nextBallColor === 'color') {
                    totalScore += b.value;
                    currentBreak += b.value;
                    nextBallColor = 'red';
                    updateScoreboard();
                    showToast('+' + b.value + ' 彩球', 'success', 800);
                } else {
                    foul('必须先打红球');
                }
            } else if (gamePhase === 'colors') {
                if (b.color === nextBallColor) {
                    totalScore += b.value;
                    currentBreak += b.value;
                    const order = ['yellow','green','brown','blue','pink','black'];
                    const idx = order.indexOf(b.color);
                    if (idx < order.length - 1) {
                        nextBallColor = order[idx + 1];
                    } else {
                        gamePhase = 'done';
                        endGame();
                    }
                    updateScoreboard();
                    showToast('+' + b.value + ' ' + b.color, 'success', 800);
                } else {
                    foul('必须按顺序收彩球');
                }
            }
        }
    }

    function foul(reason) {
        const penalty = 4;
        totalScore = Math.max(0, totalScore - penalty);
        currentBreak = 0;
        updateScoreboard();
        showToast('犯规！' + reason + ' 罚' + penalty + '分', 'error', 2000);
        cueBallPotted = true; // treat as cue ball foul to force reposition
    }

    function endGame() {
        showToast('练习完成！总分: ' + totalScore, 'info', 3000);
        saveStats();
    }

    function saveStats() {
        try {
            const key = 'kele_snooker_stats';
            const raw = localStorage.getItem(key);
            const stats = raw ? JSON.parse(raw) : { games: 0, totalScore: 0, bestBreak: 0, totalBalls: 0, history: [] };
            stats.games++;
            stats.totalScore += totalScore;
            stats.bestBreak = Math.max(stats.bestBreak, currentBreak);
            stats.totalBalls += (15 - redsRemaining);
            stats.history.unshift({ date: new Date().toISOString(), score: totalScore, break: currentBreak });
            if (stats.history.length > 20) stats.history.pop();
            localStorage.setItem(key, JSON.stringify(stats));
        } catch (e) { /* silent */ }
    }

    function updateScoreboard() {
        document.getElementById('scoreDisplay').textContent = totalScore;
        document.getElementById('redsDisplay').textContent = redsRemaining;
        document.getElementById('breakDisplay').textContent = currentBreak;
    }

    function showToast(msg, type, duration) {
        toastEl.textContent = msg;
        toastEl.className = 'toast ' + type + ' show';
        setTimeout(() => { toastEl.classList.remove('show'); }, duration || 2000);
    }

    /* ─── CUE BALL HANDLING ─── */
    function resetCueBall() {
        const cue = balls[0];
        cue.active = true;
        cue.potted = false;
        cue.vx = 0; cue.vy = 0;
        if (freeBallPos) {
            cue.x = freeBallPos.x;
            cue.y = freeBallPos.y;
            freeBallPos = null;
        } else {
            cue.x = scaleX(180);
            cue.y = scaleY(190);
        }
        cueBallPotted = false;
    }

    /* ─── RENDERING ─── */
    function drawTable() {
        ctx.clearRect(0, 0, TOTAL_W, TOTAL_H);
        // Wood border
        ctx.fillStyle = COLORS.wood;
        roundRect(ctx, 0, 0, TOTAL_W, TOTAL_H, 10);
        ctx.fill();
        // Inner table (cloth)
        ctx.fillStyle = COLORS.cloth;
        roundRect(ctx, WALL_THICK - WOOD_MARGIN, WALL_THICK - WOOD_MARGIN, TABLE_W + WOOD_MARGIN*2, TABLE_H + WOOD_MARGIN*2, 6);
        ctx.fill();
        // Cushions
        drawCushions();
        // Pockets
        drawPockets();
        // Spots (marks)
        drawSpots();
        // Balls
        drawBalls();
        // Cue stick & aim
        drawCueAndAim();
    }

    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawCushions() {
        ctx.fillStyle = COLORS.cushion;
        const m = WOOD_MARGIN + 4;
        const t = WALL_THICK - m;
        const w = TABLE_W + m*2;
        const h = TABLE_H + m*2;
        // Top
        ctx.beginPath();
        ctx.moveTo(t + 40, t); ctx.lineTo(t + w - 40, t);
        ctx.lineTo(t + w - 50, t + 14); ctx.lineTo(t + 50, t + 14);
        ctx.closePath(); ctx.fill();
        // Bottom
        ctx.beginPath();
        ctx.moveTo(t + 40, t + h); ctx.lineTo(t + w - 40, t + h);
        ctx.lineTo(t + w - 50, t + h - 14); ctx.lineTo(t + 50, t + h - 14);
        ctx.closePath(); ctx.fill();
        // Left
        ctx.beginPath();
        ctx.moveTo(t, t + 40); ctx.lineTo(t, t + h - 40);
        ctx.lineTo(t + 14, t + h - 50); ctx.lineTo(t + 14, t + 50);
        ctx.closePath(); ctx.fill();
        // Right
        ctx.beginPath();
        ctx.moveTo(t + w, t + 40); ctx.lineTo(t + w, t + h - 40);
        ctx.lineTo(t + w - 14, t + h - 50); ctx.lineTo(t + w - 14, t + 50);
        ctx.closePath(); ctx.fill();
    }

    function drawPockets() {
        for (const p of pockets) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.pocket;
            ctx.fill();
            ctx.strokeStyle = '#2a2d36';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function drawSpots() {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        const spots = [
            [0.5, 0.5], // blue
            [0.12, 0.5], // brown
            [0.12, 0.27], // green
            [0.12, 0.73], // yellow
            [0.75, 0.5], // pink
            [0.895, 0.5], // black
        ];
        for (const [fx, fy] of spots) {
            const sx = WALL_THICK + fx * TABLE_W;
            const sy = WALL_THICK + fy * TABLE_H;
            ctx.beginPath();
            ctx.arc(sx, sy, 3, 0, Math.PI*2);
            ctx.fill();
        }
    }

    function drawBalls() {
        for (const b of balls) {
            if (!b.active) continue;
            drawBall(b.x, b.y, b.color, b.id);
        }
    }

    function drawBall(x, y, color, id) {
        // Shadow
        ctx.beginPath();
        ctx.arc(x + 1.5, y + 1.5, BALL_RADIUS, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fill();

        // Base
        ctx.beginPath();
        ctx.arc(x, y, BALL_RADIUS, 0, Math.PI*2);
        ctx.fillStyle = COLORS[color] || color;
        ctx.fill();

        // Highlight
        ctx.beginPath();
        ctx.arc(x - 2.5, y - 2.5, BALL_RADIUS * 0.35, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fill();

        // Number/spot for colors
        if (id >= 1 && id <= 6) {
            ctx.beginPath();
            ctx.arc(x, y, BALL_RADIUS * 0.28, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.font = 'bold 8px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(balls[id].value), x, y + 0.5);
        }
    }

    function drawCueAndAim() {
        const cue = balls[0];
        if (!cue || !cue.active) return;
        if (ballsMoving) return;

        const mx = isAiming ? aimCurrent.x : lastMousePos.x;
        const my = isAiming ? aimCurrent.y : lastMousePos.y;
        const dx = cue.x - mx;
        const dy = cue.y - my;
        const angle = Math.atan2(dy, dx);
        const dist = Math.hypot(dx, dy);
        const power = Math.min(dist / 80, 1);
        const cueLen = 180;

        // Ghost ball
        const ghostX = cue.x + Math.cos(angle) * BALL_DIAMETER;
        const ghostY = cue.y + Math.sin(angle) * BALL_DIAMETER;
        ctx.beginPath();
        ctx.arc(ghostX, ghostY, BALL_RADIUS, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Aim line
        ctx.beginPath();
        ctx.moveTo(cue.x, cue.y);
        ctx.lineTo(cue.x + Math.cos(angle) * 200, cue.y + Math.sin(angle) * 200);
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]);

        // Cue stick
        const stickX = cue.x + Math.cos(angle) * (BALL_RADIUS + 10);
        const stickY = cue.y + Math.sin(angle) * (BALL_RADIUS + 10);
        const backX = stickX + Math.cos(angle) * cueLen;
        const backY = stickY + Math.sin(angle) * cueLen;

        // Pull back when aiming
        let pull = 0;
        if (isAiming) {
            pull = Math.min(power * 25, 25);
        }
        const sx = stickX - Math.cos(angle) * pull;
        const sy = stickY - Math.sin(angle) * pull;
        const bx = backX - Math.cos(angle) * pull;
        const by = backY - Math.sin(angle) * pull;

        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(bx, by);
        ctx.strokeStyle = '#d4a574';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Cue tip
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + Math.cos(angle) * 10, sy + Math.sin(angle) * 10);
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 5;
        ctx.stroke();

        // Update power meter
        if (isAiming) {
            powerWrap.classList.add('visible');
            powerFill.style.width = (power * 100) + '%';
        } else {
            powerWrap.classList.remove('visible');
        }
    }

    /* ─── GAME LOOP ─── */
    function gameLoop() {
        const moving = updatePhysics();
        drawTable();
        if (moving) {
            animating = true;
            requestAnimationFrame(gameLoop);
        } else {
            animating = false;
            if (cueBallPotted) {
                resetCueBall();
                drawTable();
            }
        }
    }

    function triggerLoop() {
        if (!animating) {
            animating = true;
            requestAnimationFrame(gameLoop);
        }
    }

    /* ─── INPUT HANDLING ─── */
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        let cx, cy;
        if (e.touches && e.touches.length) {
            cx = e.touches[0].clientX; cy = e.touches[0].clientY;
        } else {
            cx = e.clientX; cy = e.clientY;
        }
        return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('touchstart', onDown, { passive: false });

    function onDown(e) {
        if (ballsMoving || gamePhase === 'done') return;
        e.preventDefault();
        const p = getPos(e);
        isAiming = true;
        aimStart = p;
        aimCurrent = p;
        lastMousePos = p;
    }

    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });

    function onMove(e) {
        if (!isAiming) {
            const p = getPos(e);
            lastMousePos = p;
            if (!ballsMoving) drawTable();
            return;
        }
        e.preventDefault();
        const p = getPos(e);
        aimCurrent = p;
        lastMousePos = p;
        drawTable();
    }

    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);

    function onUp(e) {
        if (!isAiming) return;
        isAiming = false;
        powerWrap.classList.remove('visible');
        const cue = balls[0];
        if (!cue || !cue.active) return;
        const dx = cue.x - aimCurrent.x;
        const dy = cue.y - aimCurrent.y;
        const dist = Math.hypot(dx, dy);
        let power = Math.min(dist / 80, 1) * MAX_POWER;
        if (power < 1.5) { drawTable(); return; }
        const angle = Math.atan2(dy, dx);
        cue.vx = Math.cos(angle) * power;
        cue.vy = Math.sin(angle) * power;
        triggerLoop();
    }

    canvas.addEventListener('mouseenter', () => { mouseInCanvas = true; });
    canvas.addEventListener('mouseleave', () => { mouseInCanvas = false; });

    /* ─── CONTROLS ─── */
    document.getElementById('resetBtn').addEventListener('click', () => {
        initBalls();
        drawTable();
    });
    document.getElementById('rulesBtn').addEventListener('click', () => {
        showToast('规则：先打红球（1分），再打彩球（按分值），交替进行。犯规罚4分。', 'info', 4000);
    });

    /* ─── INIT ─── */
    calcTableSize();
    initBalls();
    drawTable();

    window.addEventListener('resize', () => {
        calcTableSize();
        initBalls();
        drawTable();
    });

})();
</script>
</body>
</html>
