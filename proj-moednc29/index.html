<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1a2e;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #gameCanvas {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(15, 52, 96, 0.5);
    display: block;
    width: min(400px, 90vw);
    height: auto;
    aspect-ratio: 1 / 1;
  }
  #uiLayer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #uiLayer.active { pointer-events: auto; }
  .panel {
    background: rgba(22, 33, 62, 0.95);
    border: 2px solid #e94560;
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    max-width: 320px;
    width: 85%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .panel h1 { font-size: 28px; margin-bottom: 16px; color: #e94560; }
  .panel p { margin: 8px 0; font-size: 16px; line-height: 1.5; }
  .panel button {
    margin-top: 16px;
    padding: 12px 32px;
    font-size: 18px;
    border: none;
    border-radius: 6px;
    background: #e94560;
    color: white;
    cursor: pointer;
    pointer-events: auto;
    transition: background 0.1s;
  }
  .panel button:active { background: #c23a51; }
  #scoreBoard {
    position: absolute;
    top: 16px; left: 50%; transform: translateX(-50%);
    font-size: 20px;
    font-weight: bold;
    color: #e94560;
    text-shadow: 0 0 8px rgba(233, 69, 96, 0.6);
    pointer-events: none;
    z-index: 5;
  }
  #touchControls {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 10;
  }
  .control-row {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }
  #touchControls button {
    width: 56px; height: 56px;
    font-size: 24px;
    border: 2px solid #0f3460;
    border-radius: 10px;
    background: rgba(15, 52, 96, 0.6);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #touchControls button:active { background: #e94560; border-color: #e94560; }
  .hidden { display: none !important; }
</style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() { /* ignore */ });
    }
  </script>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<div id="scoreBoard">得分: 0</div>
<div id="uiLayer" class="active">
  <div id="startPanel" class="panel">
    <h1>贪吃蛇</h1>
    <p>使用方向键或 WASD 控制蛇的移动</p>
    <p>按空格键或点击按钮开始游戏</p>
    <button id="startBtn">开始游戏</button>
  </div>
  <div id="gameOverPanel" class="panel hidden">
    <h1>游戏结束</h1>
    <p id="finalScore">最终得分: 0</p>
    <p>按空格键或点击按钮重新开始</p>
    <button id="restartBtn">重新开始</button>
  </div>
</div>
<div id="touchControls">
  <div class="control-row">
    <button id="btnUp">▲</button>
  </div>
  <div class="control-row">
    <button id="btnLeft">◀</button>
    <button id="btnDown">▼</button>
    <button id="btnRight">▶</button>
  </div>
</div>

<script>
(function() {
  const CANVAS_SIZE = 400;
  const GRID_COUNT = 20;
  const TILE_SIZE = CANVAS_SIZE / GRID_COUNT;
  const INITIAL_SPEED = 150;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreBoard = document.getElementById('scoreBoard');
  const uiLayer = document.getElementById('uiLayer');
  const startPanel = document.getElementById('startPanel');
  const gameOverPanel = document.getElementById('gameOverPanel');
  const finalScoreText = document.getElementById('finalScore');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  let snake = [];
  let food = { x: 0, y: 0 };
  let dx = 0;
  let dy = 0;
  let pendingDx = 0;
  let pendingDy = 0;
  let score = 0;
  let gameState = 'MENU';
  let lastUpdateTime = 0;
  let currentSpeed = INITIAL_SPEED;

  function init() {
    resetGameData();
    draw();
    setupEventListeners();
    requestAnimationFrame(gameLoop);
  }

  function resetGameData() {
    snake = [{ x: 10, y: 10 }];
    dx = 0;
    dy = 0;
    pendingDx = 0;
    pendingDy = 0;
    score = 0;
    currentSpeed = INITIAL_SPEED;
    updateScoreDisplay();
    spawnFood();
  }

  function spawnFood() {
    let validPosition = false;
    while (!validPosition) {
      const x = Math.floor(Math.random() * GRID_COUNT);
      const y = Math.floor(Math.random() * GRID_COUNT);
      let onSnake = false;
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === x && snake[i].y === y) {
          onSnake = true;
          break;
        }
      }
      if (!onSnake) {
        food = { x, y };
        validPosition = true;
      }
    }
  }

  function startGame() {
    resetGameData();
    gameState = 'PLAYING';
    lastUpdateTime = performance.now();
    uiLayer.classList.remove('active');
    startPanel.classList.add('hidden');
    gameOverPanel.classList.add('hidden');
    dx = 1;
    dy = 0;
    pendingDx = 0;
    pendingDy = 0;
  }

  function gameOver() {
    gameState = 'GAMEOVER';
    finalScoreText.textContent = '最终得分: ' + score;
    uiLayer.classList.add('active');
    gameOverPanel.classList.remove('hidden');
  }

  function updateScoreDisplay() {
    scoreBoard.textContent = '得分: ' + score;
  }

  function handleDirectionInput(newDx, newDy) {
    if (gameState !== 'PLAYING') return;
    const activeDx = pendingDx !== 0 || pendingDy !== 0 ? pendingDx : dx;
    const activeDy = pendingDx !== 0 || pendingDy !== 0 ? pendingDy : dy;
    if (activeDx !== 0 && newDx !== 0) return;
    if (activeDy !== 0 && newDy !== 0) return;
    pendingDx = newDx;
    pendingDy = newDy;
  }

  function processPendingDirection() {
    if (pendingDx === 0 && pendingDy === 0) return;
    dx = pendingDx;
    dy = pendingDy;
    pendingDx = 0;
    pendingDy = 0;
  }

  function update() {
    if (gameState !== 'PLAYING') return;
    processPendingDirection();
    if (dx === 0 && dy === 0) return;

    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
      gameOver();
      return;
    }

    const willGrow = (head.x === food.x && head.y === food.y);
    const checkLength = willGrow ? snake.length : snake.length - 1;
    for (let i = 0; i < checkLength; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      updateScoreDisplay();
      spawnFood();
      if (currentSpeed > 60) {
        currentSpeed -= 2;
      }
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

    ctx.strokeStyle = 'rgba(15, 52, 96, 0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_COUNT; i++) {
      ctx.beginPath();
      ctx.moveTo(i * TILE_SIZE, 0);
      ctx.lineTo(i * TILE_SIZE, CANVAS_SIZE);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * TILE_SIZE);
      ctx.lineTo(CANVAS_SIZE, i * TILE_SIZE);
      ctx.stroke();
    }

    ctx.fillStyle = '#e94560';
    ctx.shadowColor = '#e94560';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    const foodCx = food.x * TILE_SIZE + TILE_SIZE / 2;
    const foodCy = food.y * TILE_SIZE + TILE_SIZE / 2;
    const foodRadius = TILE_SIZE / 2 - 2;
    ctx.arc(foodCx, foodCy, foodRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    for (let i = 0; i < snake.length; i++) {
      const segment = snake[i];
      if (i === 0) {
        ctx.fillStyle = '#00d9ff';
        ctx.shadowColor = '#00d9ff';
        ctx.shadowBlur = 8;
      } else {
        ctx.fillStyle = '#0f3460';
        ctx.shadowBlur = 0;
      }

      const padding = 1;
      ctx.fillRect(
        segment.x * TILE_SIZE + padding,
        segment.y * TILE_SIZE + padding,
        TILE_SIZE - padding * 2,
        TILE_SIZE - padding * 2
      );

      if (i === 0) {
        ctx.shadowBlur = 0;
      }
    }
  }

  function gameLoop(currentTime) {
    requestAnimationFrame(gameLoop);

    if (gameState === 'PLAYING') {
      const elapsed = currentTime - lastUpdateTime;
      if (elapsed >= currentSpeed) {
        update();
        lastUpdateTime = currentTime;
      }
    }

    draw();
  }

  function setupEventListeners() {
    document.addEventListener('keydown', function(e) {
      const key = e.key;
      if (key === ' ' || key === 'Spacebar') {
        e.preventDefault();
        if (gameState === 'MENU' || gameState === 'GAMEOVER') {
          startGame();
        }
        return;
      }

      if (key === 'ArrowUp' || key === 'w' || key === 'W') {
        e.preventDefault();
        handleDirectionInput(0, -1);
      } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
        e.preventDefault();
        handleDirectionInput(0, 1);
      } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
        e.preventDefault();
        handleDirectionInput(-1, 0);
      } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
        e.preventDefault();
        handleDirectionInput(1, 0);
      }
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    document.getElementById('btnUp').addEventListener('touchstart', function(e) {
      e.preventDefault();
      handleDirectionInput(0, -1);
    });
    document.getElementById('btnDown').addEventListener('touchstart', function(e) {
      e.preventDefault();
      handleDirectionInput(0, 1);
    });
    document.getElementById('btnLeft').addEventListener('touchstart', function(e) {
      e.preventDefault();
      handleDirectionInput(-1, 0);
    });
    document.getElementById('btnRight').addEventListener('touchstart', function(e) {
      e.preventDefault();
      handleDirectionInput(1, 0);
    });

    document.getElementById('btnUp').addEventListener('mousedown', function(e) {
      e.preventDefault();
      handleDirectionInput(0, -1);
    });
    document.getElementById('btnDown').addEventListener('mousedown', function(e) {
      e.preventDefault();
      handleDirectionInput(0, 1);
    });
    document.getElementById('btnLeft').addEventListener('mousedown', function(e) {
      e.preventDefault();
      handleDirectionInput(-1, 0);
    });
    document.getElementById('btnRight').addEventListener('mousedown', function(e) {
      e.preventDefault();
      handleDirectionInput(1, 0);
    });
  }

  init();
})();
</script>
</body>
</html>
